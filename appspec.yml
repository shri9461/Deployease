version: 0.0
os: linux
files:
  - source: /backend
    destination: /var/www/deployease/backend
  - source: /frontend/dist
    destination: /var/www/deployease/frontend
hooks:
  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: root
