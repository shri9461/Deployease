version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing dependencies...
      - cd frontend && npm install
      - cd ../backend && npm install
  pre_build:
    commands:
      - echo Running tests...
      - cd ../frontend && npm test
      - cd ../backend && npm test
  build:
    commands:
      - echo Building frontend...
      - cd ../frontend && npm run build
  post_build:
    commands:
      - echo Build and Test completed on `date`
artifacts:
  files:
    - 'frontend/dist/**/*'
    - 'backend/**/*'
    - 'appspec.yml'
    - 'scripts/**/*'
    - 'docker-compose.yml'
    - 'Dockerfile'
