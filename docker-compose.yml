version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./backend/deployments.json:/app/deployments.json

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
